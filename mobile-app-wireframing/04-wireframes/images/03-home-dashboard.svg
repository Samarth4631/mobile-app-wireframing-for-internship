<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="373" height="810" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <rect x="0" y="0" width="375" height="30" fill="#f2f2f2" stroke="#222" stroke-width="1"/>

  <!-- header greeting -->
  <rect x="25" y="55" width="140" height="14" fill="#d9d9d9"/>
  <rect x="25" y="75" width="90" height="9" fill="#e8e8e8"/>
  <!-- avatar -->
  <circle cx="335" cy="70" r="20" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>

  <!-- streak card -->
  <rect x="25" y="115" width="325" height="70" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
  <rect x="45" y="135" width="20" height="30" fill="#d0d0d0"/>
  <rect x="80" y="138" width="120" height="10" fill="#ccc"/>
  <rect x="80" y="156" width="80" height="8" fill="#e0e0e0"/>

  <!-- weekly trend mini card -->
  <rect x="25" y="200" width="325" height="120" rx="10" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <rect x="40" y="212" width="110" height="9" fill="#d9d9d9"/>
  <!-- simple bar chart -->
  <rect x="45" y="280" width="18" height="25" fill="#ccc"/>
  <rect x="75" y="260" width="18" height="45" fill="#ccc"/>
  <rect x="105" y="270" width="18" height="35" fill="#ccc"/>
  <rect x="135" y="245" width="18" height="60" fill="#999"/>
  <rect x="165" y="290" width="18" height="15" fill="#ccc"/>
  <rect x="195" y="255" width="18" height="50" fill="#ccc"/>
  <rect x="225" y="265" width="18" height="40" fill="#ccc"/>
  <line x1="40" y1="305" x2="330" y2="305" stroke="#ddd" stroke-width="1"/>

  <!-- quick action buttons -->
  <rect x="25" y="340" width="152" height="90" rx="10" fill="#222"/>
  <text x="101" y="390" font-size="11" fill="#fff" text-anchor="middle">+ LOG WORKOUT</text>

  <rect x="198" y="340" width="152" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="274" y="390" font-size="11" fill="#222" text-anchor="middle">VIEW HISTORY</text>

  <!-- recent activity list -->
  <rect x="25" y="450" width="120" height="10" fill="#d9d9d9"/>
  <g>
    <rect x="25" y="475" width="325" height="56" rx="8" fill="#fff" stroke="#eee" stroke-width="1.5"/>
    <circle cx="50" cy="503" r="14" fill="#eee" stroke="#999" stroke-width="1"/>
    <rect x="75" y="493" width="130" height="9" fill="#d9d9d9"/>
    <rect x="75" y="508" width="80" height="7" fill="#eaeaea"/>
  </g>
  <g>
    <rect x="25" y="540" width="325" height="56" rx="8" fill="#fff" stroke="#eee" stroke-width="1.5"/>
    <circle cx="50" cy="568" r="14" fill="#eee" stroke="#999" stroke-width="1"/>
    <rect x="75" y="558" width="150" height="9" fill="#d9d9d9"/>
    <rect x="75" y="573" width="70" height="7" fill="#eaeaea"/>
  </g>

  <!-- bottom nav -->
  <rect x="0" y="740" width="375" height="72" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
  <circle cx="80" cy="776" r="12" fill="#222"/>
  <rect x="60" y="795" width="40" height="6" fill="#222"/>
  <circle cx="187" cy="776" r="12" fill="#ccc"/>
  <rect x="167" y="795" width="40" height="6" fill="#ccc"/>
  <circle cx="294" cy="776" r="12" fill="#ccc"/>
  <rect x="274" y="795" width="40" height="6" fill="#ccc"/>

  <text x="187" y="20" font-size="10" fill="#666" text-anchor="middle">Screen 3 · Home Dashboard</text>
