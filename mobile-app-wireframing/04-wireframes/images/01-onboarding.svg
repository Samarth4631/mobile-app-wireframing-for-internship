  <line x1="150" y1="40" x2="225" y2="40" stroke="#999" stroke-width="6" stroke-linecap="round"/>

  <!-- logo placeholder -->
  <rect x="147" y="180" width="80" height="80" rx="12" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <line x1="167" y1="220" x2="207" y2="220" stroke="#999" stroke-width="3"/>

  <!-- headline lines -->
  <rect x="60" y="300" width="255" height="14" fill="#d9d9d9"/>
  <rect x="90" y="322" width="195" height="14" fill="#d9d9d9"/>

