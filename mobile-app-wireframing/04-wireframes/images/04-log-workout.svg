<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="373" height="810" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <rect x="0" y="0" width="375" height="30" fill="#f2f2f2" stroke="#222" stroke-width="1"/>

  <!-- header -->
  <line x1="35" y1="55" x2="25" y2="65" stroke="#222" stroke-width="2"/>
  <line x1="35" y1="75" x2="25" y2="65" stroke="#222" stroke-width="2"/>
  <rect x="120" y="58" width="135" height="14" fill="#d9d9d9"/>

  <!-- activity type grid (pick one, single tap) -->
  <rect x="25" y="100" width="325" height="10" fill="#d9d9d9"/>
  <g>
    <rect x="25" y="120" width="97" height="80" rx="10" fill="#222"/>
    <circle cx="73" cy="150" r="14" fill="#fff"/>
    <text x="73" y="180" font-size="9" fill="#fff" text-anchor="middle">RUN</text>
  </g>
  <g>
    <rect x="139" y="120" width="97" height="80" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <circle cx="187" cy="150" r="14" fill="#eee" stroke="#999"/>
    <text x="187" y="180" font-size="9" fill="#222" text-anchor="middle">STRENGTH</text>
  </g>
  <g>
    <rect x="253" y="120" width="97" height="80" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <circle cx="301" cy="150" r="14" fill="#eee" stroke="#999"/>
    <text x="301" y="180" font-size="9" fill="#222" text-anchor="middle">OTHER</text>
  </g>

  <!-- selected summary -->
  <rect x="25" y="230" width="325" height="60" rx="8" fill="#f6f6f6" stroke="#ddd" stroke-width="1"/>
  <rect x="45" y="250" width="120" height="9" fill="#ccc"/>
  <rect x="45" y="266" width="80" height="7" fill="#e0e0e0"/>

  <!-- Add detail (optional, collapsed) accordion -->
  <rect x="25" y="310" width="325" height="46" rx="8" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="45" y="338" font-size="11" fill="#666">+ Add detail (optional)</text>
  <text x="320" y="338" font-size="12" fill="#999">⌄</text>

  <!-- optional expanded fields, shown lighter to indicate optional/hidden by default -->
  <g opacity="0.35">
    <rect x="25" y="366" width="150" height="42" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="40" y="382" width="60" height="8" fill="#ddd"/>
    <rect x="185" y="366" width="165" height="42" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="200" y="382" width="60" height="8" fill="#ddd"/>
  </g>

  <!-- confirm CTA -->
  <rect x="25" y="700" width="325" height="54" rx="8" fill="#222"/>
  <text x="187" y="732" font-size="12" fill="#fff" text-anchor="middle">CONFIRM · DONE IN 1 TAP</text>

  <rect x="140" y="795" width="95" height="4" rx="2" fill="#222"/>
  <text x="187" y="20" font-size="10" fill="#666" text-anchor="middle">Screen 4 · Log Workout (Quick Log)</text>
</svg>
