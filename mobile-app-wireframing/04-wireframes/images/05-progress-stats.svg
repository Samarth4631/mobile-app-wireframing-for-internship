  <rect x="0" y="740" width="375" height="72" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
  <circle cx="80" cy="776" r="12" fill="#ccc"/>
  <rect x="60" y="795" width="40" height="6" fill="#ccc"/>
  <circle cx="187" cy="776" r="12" fill="#222"/>
  <rect x="167" y="795" width="40" height="6" fill="#222"/>
  <circle cx="294" cy="776" r="12" fill="#ccc"/>
  <rect x="274" y="795" width="40" height="6" fill="#ccc"/>

  <text x="187" y="20" font-size="10" fill="#666" text-anchor="middle">Screen 5 · Progress (weekly trend, default view)</text>
