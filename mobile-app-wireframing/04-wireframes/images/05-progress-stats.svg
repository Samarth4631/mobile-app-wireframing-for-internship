  <!-- calendar strip -->
  <g>
    <rect x="25" y="100" width="40" height="56" rx="8" fill="#fff" stroke="#ddd"/>
    <rect x="75" y="100" width="40" height="56" rx="8" fill="#fff" stroke="#ddd"/>
    <rect x="125" y="100" width="40" height="56" rx="8" fill="#222"/>
    <rect x="175" y="100" width="40" height="56" rx="8" fill="#fff" stroke="#ddd"/>
    <rect x="225" y="100" width="40" height="56" rx="8" fill="#fff" stroke="#ddd"/>
    <rect x="275" y="100" width="40" height="56" rx="8" fill="#eee" stroke="#ddd"/>
    <rect x="325" y="100" width="25" height="56" rx="8" fill="#eee" stroke="#ddd"/>
  </g>

  <!-- big trend chart card -->
  <rect x="25" y="180" width="325" height="200" rx="10" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <rect x="45" y="196" width="150" height="10" fill="#d9d9d9"/>
  <polyline points="50,340 95,320 140,300 185,250 230,270 275,220 320,200" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="320" cy="200" r="5" fill="#222"/>
  <line x1="45" y1="360" x2="330" y2="360" stroke="#eee" stroke-width="1"/>

  <!-- summary stat cards -->
  <rect x="25" y="400" width="100" height="90" rx="10" fill="#f6f6f6"/>
  <rect x="40" y="420" width="40" height="14" fill="#ccc"/>
  <rect x="40" y="450" width="70" height="8" fill="#e0e0e0"/>

  <rect x="137" y="400" width="100" height="90" rx="10" fill="#f6f6f6"/>
  <rect x="152" y="420" width="40" height="14" fill="#ccc"/>
  <rect x="152" y="450" width="70" height="8" fill="#e0e0e0"/>

  <rect x="249" y="400" width="100" height="90" rx="10" fill="#f6f6f6"/>
  <rect x="264" y="420" width="40" height="14" fill="#ccc"/>
  <rect x="264" y="450" width="70" height="8" fill="#e0e0e0"/>

  <!-- history list link -->
  <rect x="25" y="520" width="325" height="50" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="187" y="550" font-size="11" fill="#222" text-anchor="middle">VIEW FULL HISTORY →</text>

